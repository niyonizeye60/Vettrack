<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#16a34a">
  <title>Offline - VetTrack</title>
  <!--
    Shown by the service worker (public/sw.js) when a page can't load because there's
    no connection. Everything is inline: nothing else is cached, so this page can't
    load any other file.

    For a signed-in farmer it shows the copy of their records that
    components/pwa/offline-records-sync.tsx keeps, and lets them add new ones. Those
    wait on the phone (components/pwa/offline-outbox.ts describes how) until sw.js
    sends them. Everyone else gets the plain "You're offline" message.

    The forms follow the app's own (app/(farmer)/farmer/milk, components/livestock/*,
    app/(farmer)/farmer/calves) and post the same fields, so keep them in step.
  -->
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: #f9fafb;
      color: #111827;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-text-size-adjust: 100%;
    }
    [hidden] { display: none !important; }
    /* Until we know whether there's a saved copy, so the plain message doesn't flash. */
    .checking .plain { visibility: hidden; }

    .plain {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .plain main { max-width: 360px; text-align: center; }
    .plain .icon {
      width: 72px;
      height: 72px;
      margin: 0 auto;
      border-radius: 50%;
      background: #dcfce7;
      color: #16a34a;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .plain h1 { font-size: 20px; margin: 20px 0 8px; }
    .plain p { margin: 0; color: #6b7280; font-size: 15px; line-height: 1.5; }
    .btn {
      background: #16a34a;
      color: #fff;
      border: 0;
      border-radius: 8px;
      padding: 12px 24px;
      font: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:hover { background: #15803d; }
    .btn[disabled] { opacity: 0.6; cursor: default; }
    .plain .btn { margin-top: 24px; }
    .btn-light { background: #fff; color: #374151; border: 1px solid #d1d5db; }
    .btn-light:hover { background: #f9fafb; }

    /* The saved records */
    .wrap { max-width: 720px; margin: 0 auto; padding-left: 16px; padding-right: 16px; }
    .top { position: sticky; top: 0; z-index: 1; background: #fff; border-bottom: 1px solid #e5e7eb; }
    .top-inner { display: flex; align-items: center; gap: 12px; padding-top: 12px; padding-bottom: 8px; }
    .top-icon {
      flex: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #fef3c7;
      color: #b45309;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .top-text { flex: 1; min-width: 0; }
    .top-title { font-weight: 600; font-size: 15px; }
    .top-sub { color: #6b7280; font-size: 13px; margin-top: 2px; overflow-wrap: anywhere; }
    .btn-sm { flex: none; padding: 8px 12px; font-size: 13px; }
    .chip {
      margin-top: 6px;
      padding: 2px 10px;
      border: 1px solid #fde68a;
      border-radius: 999px;
      background: #fffbeb;
      color: #b45309;
      font: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .chip.red { border-color: #fecaca; background: #fef2f2; color: #b91c1c; }
    .tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      flex: none;
      background: none;
      border: 0;
      border-bottom: 2px solid transparent;
      padding: 10px 8px;
      font: inherit;
      font-size: 14px;
      color: #6b7280;
      cursor: pointer;
      white-space: nowrap;
    }
    .tab[aria-selected="true"] { color: #15803d; border-bottom-color: #16a34a; font-weight: 600; }
    .count {
      display: inline-block;
      margin-left: 6px;
      min-width: 20px;
      padding: 0 6px;
      border-radius: 999px;
      background: #f3f4f6;
      color: #6b7280;
      font-size: 12px;
      font-weight: 500;
      line-height: 20px;
      text-align: center;
    }
    .tab[aria-selected="true"] .count { background: #dcfce7; color: #15803d; }

    .panel { padding-top: 16px; padding-bottom: 32px; }
    .note { margin: 0 0 12px; color: #6b7280; font-size: 13px; line-height: 1.5; }
    .adds { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .add {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 14px;
      border: 1px solid #bbf7d0;
      border-radius: 8px;
      background: #f0fdf4;
      color: #15803d;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .add:hover { background: #dcfce7; }
    .add-sm { padding: 6px 10px; font-size: 13px; }
    .search {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      background: #fff;
      color: inherit;
      font: inherit;
      font-size: 16px; /* smaller makes iPhones zoom in */
    }
    .search:focus, .input:focus { outline: 2px solid #16a34a; outline-offset: -1px; }
    .list { margin-top: 12px; background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; overflow: hidden; }
    .item { border-top: 1px solid #f3f4f6; }
    .item:first-child { border-top: 0; }
    .row { display: flex; align-items: flex-start; gap: 12px; padding: 12px 16px; }
    summary.row { cursor: pointer; list-style: none; }
    summary.row::-webkit-details-marker { display: none; }
    summary.row:focus-visible { outline: 2px solid #16a34a; outline-offset: -2px; }
    .row-main { flex: 1; min-width: 0; }
    .row-title { font-weight: 600; font-size: 15px; overflow-wrap: anywhere; }
    .row-sub { color: #6b7280; font-size: 13px; margin-top: 2px; overflow-wrap: anywhere; }
    .row-err { color: #b91c1c; font-size: 13px; margin-top: 4px; overflow-wrap: anywhere; }
    .row-side { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; text-align: right; font-size: 14px; }
    .chev { flex: none; color: #9ca3af; margin-top: 2px; transition: transform 0.15s; }
    details[open] > summary .chev { transform: rotate(180deg); }
    .badge {
      display: inline-block;
      padding: 1px 8px;
      border: 1px solid;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
      line-height: 1.4;
      white-space: nowrap;
    }
    .green { background: #f0fdf4; color: #15803d; border-color: #bbf7d0; }
    .red { background: #fef2f2; color: #b91c1c; border-color: #fecaca; }
    .amber { background: #fffbeb; color: #b45309; border-color: #fde68a; }
    .blue { background: #eff6ff; color: #1d4ed8; border-color: #bfdbfe; }
    .purple { background: #faf5ff; color: #7e22ce; border-color: #e9d5ff; }
    .gray { background: #f9fafb; color: #4b5563; border-color: #e5e7eb; }
    .body { padding: 0 16px 16px; }
    .body .adds { margin: 12px 0 0; }
    .facts { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; margin: 0; font-size: 14px; }
    .facts dt { color: #6b7280; }
    .facts dd { margin: 0; text-align: right; overflow-wrap: anywhere; }
    .sub-h { margin: 16px 0 4px; color: #374151; font-size: 13px; font-weight: 600; }
    .mini { list-style: none; margin: 0; padding: 0; font-size: 14px; }
    .mini li { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-top: 1px solid #f3f4f6; }
    .mini li:first-child { border-top: 0; }
    .mini li > :last-child { text-align: right; }
    .muted { color: #6b7280; }
    .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
    .stat { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 12px; }
    .stat-label { color: #6b7280; font-size: 12px; }
    .stat-value { margin-top: 4px; font-size: 20px; font-weight: 700; }
    .day-h {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 16px;
      background: #f9fafb;
      color: #374151;
      font-size: 13px;
      font-weight: 600;
    }
    .more {
      display: block;
      width: 100%;
      margin-top: 12px;
      padding: 10px;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      background: #fff;
      color: inherit;
      font: inherit;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }
    .empty { padding: 32px 16px; color: #6b7280; font-size: 14px; text-align: center; }

    /* Forms and the list of records not sent yet, in a sheet over the page */
    .sheet-back {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      background: rgba(17, 24, 39, 0.5);
    }
    .sheet {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 560px;
      max-height: 92vh;
      background: #fff;
      border-radius: 16px 16px 0 0;
    }
    @media (min-width: 640px) {
      .sheet-back { align-items: center; padding: 16px; }
      .sheet { border-radius: 16px; }
    }
    .sheet-head { display: flex; align-items: center; gap: 8px; padding: 12px 8px 12px 16px; border-bottom: 1px solid #e5e7eb; }
    .sheet-title { flex: 1; min-width: 0; font-weight: 600; font-size: 16px; outline: none; }
    .icon-btn {
      flex: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 8px;
      background: none;
      color: #6b7280;
      cursor: pointer;
    }
    .icon-btn:hover { background: #f3f4f6; }
    .sheet-body { flex: 1; overflow-y: auto; padding: 16px; }
    .sheet-foot {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
      padding: 12px 16px;
      padding-bottom: max(12px, env(safe-area-inset-bottom));
      border-top: 1px solid #e5e7eb;
    }
    .sheet-foot .btn { flex: 1; max-width: 220px; padding: 12px 16px; }
    .form-error {
      flex-basis: 100%;
      margin: 0 0 4px;
      padding: 10px 12px;
      border: 1px solid #fecaca;
      border-radius: 8px;
      background: #fef2f2;
      color: #b91c1c;
      font-size: 14px;
      line-height: 1.4;
    }
    .form-error strong { display: block; margin-bottom: 2px; }
    .field { margin-bottom: 14px; }
    .field > label, .field-label { display: block; margin-bottom: 6px; color: #374151; font-size: 14px; font-weight: 500; }
    .opt { color: #9ca3af; font-size: 12px; font-weight: 400; }
    .input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      background: #fff;
      color: inherit;
      font: inherit;
      font-size: 16px;
    }
    select.input { appearance: auto; }
    textarea.input { resize: vertical; }
    .input.bad, .checks.bad, .meds.bad .med { border-color: #ef4444; }
    .err { margin-top: 4px; color: #dc2626; font-size: 13px; }
    .hint { margin-top: 4px; color: #6b7280; font-size: 12px; }
    .pair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0 12px; }
    .checks { padding: 4px 12px; border: 1px solid #d1d5db; border-radius: 8px; }
    .checks label { display: flex; align-items: center; gap: 10px; padding: 8px 0; font-size: 15px; }
    .checks input { width: 18px; height: 18px; accent-color: #16a34a; }
    .med { margin-bottom: 8px; padding: 12px; border: 1px solid #e5e7eb; border-radius: 8px; }
    .med-top { display: flex; gap: 4px; }
    .med-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 8px; }
    .med-grid label { display: block; margin-bottom: 4px; color: #6b7280; font-size: 12px; }
    .link {
      padding: 6px 0;
      border: 0;
      background: none;
      color: #15803d;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    details.extra { margin-bottom: 14px; border-top: 1px solid #f3f4f6; }
    details.extra > summary { padding: 12px 0; color: #15803d; font-size: 14px; font-weight: 600; cursor: pointer; }
    .unsent-row { display: flex; align-items: flex-start; gap: 12px; padding: 12px 0; border-top: 1px solid #f3f4f6; }
    .unsent-row:first-child { border-top: 0; }
    .remove {
      flex: none;
      padding: 6px 10px;
      border: 1px solid #fecaca;
      border-radius: 8px;
      background: #fff;
      color: #b91c1c;
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .toast {
      position: fixed;
      left: 16px;
      right: 16px;
      bottom: max(16px, env(safe-area-inset-bottom));
      z-index: 20;
      max-width: 480px;
      margin: 0 auto;
      padding: 12px 16px;
      border-radius: 10px;
      background: #111827;
      color: #fff;
      font-size: 14px;
      line-height: 1.4;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }
  </style>
</head>
<body>
  <script>document.body.className = "checking"</script>

  <div class="plain">
    <main>
      <div class="icon" aria-hidden="true">
        <!-- lucide "wifi-off" -->
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20h.01"/><path d="M8.5 16.429a5 5 0 0 1 7 0"/><path d="M5 12.859a10 10 0 0 1 5.17-2.69"/><path d="M19 12.859a10 10 0 0 0-2.007-1.523"/><path d="M2 8.82a15 15 0 0 1 4.177-2.643"/><path d="M22 8.82a15 15 0 0 0-11.288-3.764"/><path d="m2 2 20 20"/>

    </main>
  </div>

  <div id="records" hidden>
    <header class="top">
      <div class="wrap top-inner">
        <div class="top-icon" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20h.01"/><path d="M8.5 16.429a5 5 0 0 1 7 0"/><path d="M5 12.859a10 10 0 0 1 5.17-2.69"/><path d="M19 12.859a10 10 0 0 0-2.007-1.523"/><path d="M2 8.82a15 15 0 0 1 4.177-2.643"/><path d="M22 8.82a15 15 0 0 0-11.288-3.764"/><path d="m2 2 20 20"/>
          </svg>
        </div>
        <div class="top-text">
          <div class="top-title" id="r-title"></div>
          <div class="top-sub" id="r-saved"></div>
          <button class="chip" id="r-waiting" type="button" hidden></button>
        </div>
        <button class="btn btn-sm" id="r-retry" type="button"></button>
      </div>
      <div class="wrap tabs" id="r-tabs" role="tablist"></div>
    </header>
    <div class="wrap panel" id="r-panel" role="tabpanel">
      <p class="note" id="r-note"></p>
      <div class="adds" id="r-adds"></div>
      <input class="search" id="r-search" type="search" autocomplete="off">
      <div id="r-content"></div>
    </div>
  </div>

            return rows.map(function (r) { return { medicineName: r.name.value.trim(), doseCount: r.count.value, volumeMl: r.volume.value, cost: r.cost.value } })
          }
          set = function () {}
        } else {
          input = h(def.type === "textarea" ? "textarea" : "input", {
            class: "input",
            id: id,
            type: def.type === "textarea" ? null : def.type,
            rows: def.type === "textarea" ? "2" : null,
            inputmode: def.type === "number" ? "decimal" : null,
            min: def.type === "number" ? "0" : null,
            step: def.step,
            placeholder: def.placeholder ? t(def.placeholder) : null,
            list: def.list ? id + "-list" : null,
            autocomplete: "off",
            oninput: changed,
          })
          get = function () { return input.value.trim() }
          set = function (v) { input.value = v == null ? "" : v }
        }
        if (def.value != null) set(def.value)
        var hint = def.hint ? h("div", { class: "hint", text: t(def.hint) }) : null
        var wrap = h("div", { class: "field" }, [
          labelEl,
          input,
          def.list ? h("datalist", { id: id + "-list" }, def.list.map(function (v) { return h("option", { value: v }) })) : null,
          hint,
          err,
        ])
        if (input.id) input.setAttribute("aria-describedby", id + "-err")
        return {
          el: wrap,
          get: get,
          set: set,
          focus: function () { (input.querySelector ? input.querySelector("input, select") || input : input).focus() },
          error: showError,
        }
      }

      // A form for one kind of record. `spec`: title, kind, fields (field defs, [a, b]
      // for two side by side, or { extra: [...] } for "More details"), validate(v),
      // body(v), and optionally change(name, v, set), gated (the on-farm rule applies),
      // saveLabel.
      function openForm(spec) {
        var controls = {}
        var form = h("form", { id: "sheet-form", novalidate: true })
        function values() {
          var v = {}
          Object.keys(controls).forEach(function (k) { v[k] = controls[k].get() })
          return v
        }
        function set(name, value) { if (controls[name]) controls[name].set(value) }
        function changed(name) { if (spec.change) spec.change(name, values(), set) }
        function layout(fields, parent) {
          fields.forEach(function (f) {
            if (Array.isArray(f)) {
              var pair = h("div", { class: "pair" })
              layout(f, pair)
              parent.appendChild(pair)
            } else if (f.extra) {
              var extra = h("details", { class: "extra" }, [h("summary", { text: t("moreDetails") })])
              layout(f.extra, extra)
              parent.appendChild(extra)
            } else {
              var c = control(f, changed)
              controls[f.name] = c
              parent.appendChild(c.el)
            }
          })
        }
        layout(spec.fields, form)
        // Pre-filled from where the form was opened (an animal's card, a disease case).
        if (spec.preset) Object.keys(spec.preset).forEach(function (k) { set(k, spec.preset[k]); changed(k) })

        var formError = h("div", { class: "form-error", role: "alert", hidden: true })
        var saveText = t(spec.saveLabel || "saveRecord")
        var save = h("button", { class: "btn", type: "submit", form: "sheet-form", text: saveText })
        var cancel = h("button", { class: "btn btn-light", type: "button", text: t("cancel"), onclick: function () { closeSheet() } })
        function fail(title, message) {
          formError.textContent = ""
          if (title) formError.appendChild(h("strong", { text: title }))
          formError.appendChild(document.createTextNode(message))
          formError.hidden = false
        }

        form.addEventListener("submit", async function (e) {
          e.preventDefault()
          if (save.disabled) return
          formError.hidden = true
          var v = values()
          var errors = spec.validate(v) || {}
          Object.keys(controls).forEach(function (k) { controls[k].error(errors[k]) })
          var bad = Object.keys(errors).filter(function (k) { return errors[k] })
          if (bad.length) {
            if (controls[bad[0]]) controls[bad[0]].focus()
            else fail(null, errors[bad[0]])
            return
          }
          var body = spec.body(v)
          body.farmerId = copy.userId
          save.disabled = true
          try {
            if (spec.gated && rule.required) {
              save.textContent = t("locating")
              var pos = await locate()
              if (!pos) return fail(t("wrongLocation"), t("locationRequired"))
              if (!onFarm(rule, pos)) return fail(t("wrongLocation"), t("sectorOnly", { sector: rule.sector }))
              body.lat = pos.lat
              body.lng = pos.lng
              body.accuracy = pos.accuracy
            }
            await addEntry(spec.kind, body)
            closeSheet()
            toast(t("savedOnPhone"))
          } catch (error) {
            fail(null, t("saveFailed"))
          } finally {
            save.disabled = false
            save.textContent = saveText
          }
        })

        openSheet(t(spec.title), form, [formError, cancel, save])
      }

      async function addEntry(kind, body) {
        var entry = { id: newId(), userId: copy.userId, kind: kind, body: body, createdAt: new Date().toISOString(), status: "pending" }
        await putEntry(entry)
        outbox.push(entry)
        refresh()
        requestSend()
      }

      function describe(entry) {
        var b = entry.body || {}
        var KIND = { milk: "kindMilk", disease: "kindDisease", dose: "kindDose", vaccination: "kindVaccination", insemination: "kindInsemination", calf: "kindCalf", calfWeight: "kindCalfWeight" }
        var parts = {
          milk: [b.cowName, [day(b.date), sessionLabel(b.session), b.liters ? liters(b.liters) : ""]],
          disease: [b.animalName, [b.diseaseName, day(b.diagnosedDate)]],
          dose: [b.animalName, [b.diseaseName, day(b.date), sessionLabel(b.session)]],
          vaccination: [b.subjectName, [b.vaccineName, day(b.date)]],
          insemination: [b.animalName, [day(b.date), (b.semenTypes || []).join(", ")]],
          calf: [b.name, [day(b.birthDate)]],
          calfWeight: [b.calfName, [b.weight ? b.weight + " kg" : "", day(b.date)]],
        }[entry.kind] || ["", []]
        return { title: joinDot([t(KIND[entry.kind] || entry.kind), parts[0]]), detail: joinDot(parts[1]) }
      }
      // Records made here for this one, which can't be saved without it.
      function dependents(entry) {
        return outbox.filter(function (other) {
          return Object.keys(other.body || {}).some(function (k) { return other.body[k] === REF_PREFIX + entry.id })
        })

      function unsentList() {
        var list = h("div")
        var entries = unsent().slice().reverse()
        if (!entries.length) list.appendChild(h("div", { class: "empty", text: t("noRecords") }))
        entries.forEach(function (entry) {
          var d = describe(entry)
          list.appendChild(h("div", { class: "unsent-row" }, [
            h("div", { class: "row-main" }, [
              h("div", { class: "row-title", text: d.title }),
              d.detail ? h("div", { class: "row-sub", text: d.detail }) : null,
              entry.status === "failed" ? h("div", { class: "row-err", text: failure(entry) }) : null,
            ]),
            h("div", { class: "row-side" }, [
              entry.status === "failed" ? badge(t("notSaved"), "red") : badge(t("notSent"), "amber"),
              h("button", { class: "remove", type: "button", text: t("remove"), onclick: function () { remove(entry) } }),
            ]),
          ]))
        })
        return h("div", null, [h("p", { class: "note", text: t("unsentNote") }), list])
      }
      function showUnsent() {
        openSheet(t("notSent"), unsentList(), [h("button", { class: "btn btn-light", type: "button", text: t("close"), onclick: function () { closeSheet() } })])
      }
      async function remove(entry) {
        var also = dependents(entry)
        if (!window.confirm(t("removeConfirm") + (also.length ? " " + plural("removeAlso", also.length) : ""))) return
        var ids = [entry.id].concat(also.map(function (e) { return e.id }))
        await deleteEntries(ids)
        outbox = outbox.filter(function (e) { return ids.indexOf(e.id) === -1 })
        refresh()
        if (sheet) {
          var body = sheet.querySelector(".sheet-body")
          body.textContent = ""
          body.appendChild(unsentList())
        }
      }

      // The service worker sent some (the connection came back while this page is open).
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.addEventListener("message", function (event) {
          if (!event.data || event.data.type !== "outbox-changed") return
          readOutbox(copy.userId).then(function (entries) {
            outbox = entries
            refresh()
          }).catch(function () {})
        })
      }

      // Opens on the part of the app the farmer was trying to reach.
      var TABS = [
        { id: "animals", key: "animals", render: renderAnimals, path: "/farmer/animals", adds: [] },
        { id: "milk", key: "milk", render: renderMilk, path: "/farmer/milk", adds: [["newMilk", function () { milkForm() }]] },
        { id: "diseases", key: "diseases", render: renderDiseases, path: "/farmer/diseases", adds: [["newDisease", function () { diseaseForm() }], ["newDose", function () { doseForm() }]] },
        { id: "vaccination", key: "vaccinations", render: renderVaccination, path: "/farmer/vaccination", adds: [["newVaccination", function () { vaccinationForm() }]] },
        { id: "insemination", key: "inseminations", render: renderInsemination, path: "/farmer/insemination", adds: [["newInsemination", function () { inseminationForm() }]] },
        { id: "calves", key: "calves", render: renderCalves, path: "/farmer/calves", adds: [["newCalf", function () { calfForm() }], ["newWeight", function () { weightForm() }]] },
      ]
      var current = TABS[0]
      TABS.forEach(function (tab) {
        if (location.pathname === tab.path || location.pathname.indexOf(tab.path + "/") === 0) current = tab
      })

      var tabBar = document.getElementById("r-tabs")
      var content = document.getElementById("r-content")
      var adds = document.getElementById("r-adds")
      var search = document.getElementById("r-search")
      var waiting = document.getElementById("r-waiting")
      TABS.forEach(function (tab) {
        tab.countEl = h("span", { class: "count" })
        tab.button = h("button", { class: "tab", type: "button", role: "tab", "aria-controls": "r-panel", onclick: function () { select(tab) } }, [
          t(tab.id),
          tab.countEl,
        ])
        tabBar.appendChild(tab.button)
      })
      // Cards that were open stay open, so adding a dose to a case doesn't close it.
      function draw() {
        var open = {}
        Array.prototype.forEach.call(content.querySelectorAll("details[open][data-key]"), function (d) { open[d.getAttribute("data-key")] = true })
        content.textContent = ""
        content.appendChild(current.render(norm(search.value.trim())))
        Array.prototype.forEach.call(content.querySelectorAll("details[data-key]"), function (d) {
          if (open[d.getAttribute("data-key")]) d.open = true
        })
      }
      function select(tab) {
        current = tab
        TABS.forEach(function (x) { x.button.setAttribute("aria-selected", x === tab ? "true" : "false") })
        tab.button.scrollIntoView({ block: "nearest", inline: "nearest" })
        adds.textContent = ""
        tab.adds.forEach(function (a) { adds.appendChild(addButton(a[0], a[1])) })
        adds.hidden = !tab.adds.length
        draw()
      }
      // After records are added or removed here, or sent.
      function refresh() {
        rebuild()
        TABS.forEach(function (tab) { tab.countEl.textContent = String(data[tab.key].length) })
        var list = unsent()
        waiting.hidden = !list.length
        waiting.textContent = t("waitingCount", { count: list.length })
        waiting.classList.toggle("red", list.some(function (e) { return e.status === "failed" }))
        draw()
      }
      waiting.addEventListener("click", showUnsent)

      document.getElementById("r-title").textContent = t("offline")
      var savedAt = copy.savedAt ? new Date(copy.savedAt) : null
      document.getElementById("r-saved").textContent = joinDot([
        copy.name,
        savedAt && !isNaN(savedAt) ? t("saved", { time: savedFormat.format(savedAt) }) : "",
      ])
      document.getElementById("r-retry").textContent = t("tryAgain")
      document.getElementById("r-note").textContent = t("note")
      search.placeholder = t("search")
      search.setAttribute("aria-label", t("search"))
      search.addEventListener("input", draw)

      document.querySelector(".plain").hidden = true
      document.getElementById("records").hidden = false
      document.body.className = ""
      refresh()
      select(current)
    }
  })()
  </script>
</body>
</html>
