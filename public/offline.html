<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#16a34a">
  <title>Offline - VetTrack</title>
  <!--
    Shown by the service worker (public/sw.js) when a page can't load because there's
    no connection. Everything is inline: nothing else is cached, so this page can't
    load any other file.
  -->
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: #f9fafb;
      color: #111827;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 360px; text-align: center; }
    .icon {
      width: 72px;
      height: 72px;
      margin: 0 auto;
      border-radius: 50%;
      background: #dcfce7;
      color: #16a34a;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    h1 { font-size: 20px; margin: 20px 0 8px; }
    p { margin: 0; color: #6b7280; font-size: 15px; line-height: 1.5; }
    button {
      margin-top: 24px;
      background: #16a34a;
      color: #fff;
      border: 0;
      border-radius: 8px;
      padding: 12px 24px;
      font: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #15803d; }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">
      <!-- lucide "wifi-off" -->
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 20h.01"/><path d="M8.5 16.429a5 5 0 0 1 7 0"/><path d="M5 12.859a10 10 0 0 1 5.17-2.69"/><path d="M19 12.859a10 10 0 0 0-2.007-1.523"/><path d="M2 8.82a15 15 0 0 1 4.177-2.643"/><path d="M22 8.82a15 15 0 0 0-11.288-3.764"/><path d="m2 2 20 20"/>
      </svg>
    </div>
    <h1 id="title">You're offline</h1>
    <p id="desc">Check your internet connection, then try again.</p>
    <button id="retry" type="button">Try again</button>
  </main>
  <script>
    // Same choice the site stores in LanguageContext.
    try {
      if (localStorage.getItem("language") === "rw") {
        document.documentElement.lang = "rw"
        document.title = "Nta interineti - VetTrack"
        document.getElementById("title").textContent = "Nta interineti ufite"
        document.getElementById("desc").textContent = "Reba interineti yawe hanyuma wongere ugerageze."
        document.getElementById("retry").textContent = "Ongera ugerageze"
      }
    } catch (e) {}

    // This page is served in place of the one that failed, so reloading opens that page.
    document.getElementById("retry").addEventListener("click", function () { location.reload() })
    window.addEventListener("online", function () { location.reload() })
  </script>
</body>
</html>
